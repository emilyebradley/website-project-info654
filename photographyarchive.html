<!DOCTYPE html>
<html>

<head>
    <meta charset=“UTF-8”>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bradley Image Archive</title>
    <style>
        /* #header,
        footer #header #footer #navbar .row {
            display: flex
        } */

        
        .row {
            display: flex
        }

        .column {
            flex: 40%;
            padding: 20px
        }

        /* .emilyclass{} */
    </style>
</head>

<body>
    <div id="header">
        <h1>Bradley Image Archive</h1>
        <h2>A Home for an Amatuer Photographer without Instagram</h2>
    </div>

    <div id="navbar">
    </div>

    <h2>Photography Archive</h2>

    <div class="row">
        <div class="column">
            <h3>Portraits</h3>
            <img src="./images/girluganda.jpg" alt="girl" width="200">
            <h3>Natural</h3>
            <img src="./images/boatinwater.jpg" alt="boat in water" width="200">
            <h3>Urban and Industrial</h3>
            <img src="./images/shadows.jpg" alt="street in Kotor" width="200">
        </div>

        <div class="column">
            <h3>Street Scene</h3>
            <img src="./images/montenegrokitten.jpg" alt="cat" width="200">
            <h3>Textures</h3>
            <img src="./images/scales.jpg" alt="fish" width="200">
        </div>
    </div>


    <div id="footer">
        <h3> © Emily Bradley. 2025 </h3>
    </div>
</body>

</html>
